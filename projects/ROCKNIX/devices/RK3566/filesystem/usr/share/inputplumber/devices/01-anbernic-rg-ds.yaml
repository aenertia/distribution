# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1
kind: CompositeDevice
name: Anbernic RG DS (Joypad + IMU)

# Only match on the RG-DS which has the ICM-42607P IMU
matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Anbernic RG DS

single_source: false

# Composite retrogame_joypad + ICM-42607P gyro IMU.
# DualSense target exposes motion via SDL gamepad sensor API —
# no CemuhookUDP bridge needed for Azahar/PPSSPP/melonDS.
# Match only gyro (not accel) to avoid duplicate composite devices —
# InputPlumber's BMI IMU driver reads both gyro+accel channels.
source_devices:
  - group: gamepad
    evdev:
      vendor_id: "484b"
      product_id: "1101"
      handler: event*
    capability_map_id: retrogame_joypad
  - group: imu
    iio:
      name: "icm42607p-gyro"
    config:
      imu:
        mount_matrix:
          x: [-1, 0, 0]
          y: [0, 1, 0]
          z: [0, 0, -1]

options:
  auto_manage: true

target_devices:
  - ds5
  - mouse
  - keyboard
