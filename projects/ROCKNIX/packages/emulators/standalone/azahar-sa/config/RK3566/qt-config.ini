[Audio]
# Disable audio stretching to save CPU cycles on the RK3566
enable_audio_stretching = false
output_engine = auto
output_device = auto
volume = 1.0

[Controls]
# Profiles and mappings are usually dynamically injected via the launcher script,
# but we ensure the analog parameters are configured with standard deadzones.
pad_a_deadzone = 0.150000
pad_c_deadzone = 0.150000
touch_from_button_map = 0

[Core]
# Ensure the CPU JIT is enabled (crucial for playable ARM performance)
use_cpu_jit = true

[Data%20Storage]
dump_directory = 
nand_directory = 
sdmc_directory = 

[Layout]
# 2 = Large Screen (Prioritizes Top Screen, minimizes Bottom Screen)
layout_option = 2
swap_screen = false
upright_screen = false
custom_bottom_bottom = 240
custom_bottom_left = 0
custom_bottom_right = 320
custom_bottom_top = 0
custom_top_bottom = 240
custom_top_left = 0
custom_top_right = 400
custom_top_top = 0

[Renderer]
# 0 = OpenGL, 1 = Vulkan, 2 = Software
# Force Vulkan to leverage the new Panfrost 1.1 compliant drivers
GraphicsAPI = 1

# Performance Hacks
async_presentation = true
use_disk_shader_cache = true
use_hw_shader = true
use_shader_jit = true
spirv_shader_gen = true
use_vsync = false

# Set Resolution to 1x Native (400x240) to maintain playable framerates
resolution_factor = 1

# Filter settings (0 = None / Nearest Neighbor)
texture_filter_name = 0
bg_color_b = 0
bg_color_g = 0
bg_color_r = 0
frame_limit = 100
use_custom_bg = false
use_frame_limit = true

[UI]
display_titlebar = false
fullscreen = true
single_window_mode = true

[WebService]
enable_telemetry = false
