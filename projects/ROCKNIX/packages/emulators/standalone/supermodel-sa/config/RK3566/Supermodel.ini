; Supermodel Configuration File for RK3566 (ROCKNIX)

[Global]
; --- Graphics ---
; The legacy 3D engine (0) is significantly faster on lower-end Mali GPUs like the G52.
New3DEngine = 0
QuadRendering = 0
WideScreen = 1
Stretch = 1
XResolution = 640
YResolution = 480
FullScreen = 1
VSync = 0
Throttle = 0
ShowFrameRate = 0
Crosshairs = 0

; --- Sound ---
SoundVolume = 100
MusicVolume = 100
ForceStereo = 0

; --- System ---
; Aggressive underclock for the RK3566's Cortex-A55 cores to maintain 60 FPS
PowerPCFrequency = 25
MultiThreaded = 1

; --- Force Feedback ---
DirectInputConstForceLeftMax = 100
DirectInputConstForceRightMax = 100
DirectInputSelfCenterMax = 100
DirectInputFrictionMax = 100
DirectInputVibrateMax = 100

