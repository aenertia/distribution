container_manager="lilipod"
container_image_default="docker.io/library/fedora:latest"
container_name_default="rocknix-dev"
container_home_prefix="/storage/containers/home"
container_always_pull="0"
non_interactive="0"
# ROCKNIX is a single-user root appliance. Distrobox already passes
# --privileged, --ipc/--network/--pid host, and mounts /dev, /sys, /
# into the container. Fixes needed:
# - --userns=private: lilipod defaults to keep-id which fails as root
# - Wayland socket: ROCKNIX uses /var/run/0-runtime-dir (non-standard)
#   Mount it at the same path inside the container so WAYLAND_DISPLAY works
container_manager_additional_flags="--userns private --volume /var/run/0-runtime-dir:/var/run/0-runtime-dir:rslave --env WAYLAND_DISPLAY=wayland-1 --env XDG_RUNTIME_DIR=/var/run/0-runtime-dir --env SWAYSOCK=/var/run/0-runtime-dir/sway-ipc.0.sock"
# Create unprivileged 'gamer' user on first container init.
# Many Fedora desktop apps (Kodi, Firefox, etc.) refuse to run as root
# due to polkit/systemd/dbus policies. The gamer user gets passwordless
# sudo and all hardware groups needed for GPU, audio, input, and USB.
# Create unprivileged 'gamer' user on first container init with every
# hardware group that might exist. Groups that don't exist are silently
# skipped by usermod. Zero password prompts — passwd -d removes password,
# sudoers grants NOPASSWD ALL, PAM su auth bypass disabled.
container_init_hook="if ! getent passwd gamer >/dev/null 2>&1; then useradd -m -s /bin/bash gamer; fi && passwd -d gamer && for g in wheel sudo audio video input render dialout plugdev netdev bluetooth disk tty kvm lp cdrom floppy; do groupadd -f $g 2>/dev/null; usermod -aG $g gamer 2>/dev/null; done && echo 'gamer ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/gamer && chmod 440 /etc/sudoers.d/gamer && sed -i '/^Defaults.*requiretty/s/^/# /' /etc/sudoers 2>/dev/null; sed -i '/pam_succeed_if.*uid/s/^/# /' /etc/pam.d/su 2>/dev/null; sed -i '/pam_succeed_if.*uid/s/^/# /' /etc/pam.d/su-l 2>/dev/null; true"
