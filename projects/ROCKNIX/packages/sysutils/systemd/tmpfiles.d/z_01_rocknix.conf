d    /run/rocknix       0755 root root - -
d    /run/rocknix/debug 0755 root root - -
# rfkill state dir: let systemd-rfkill use /var/lib/systemd/rfkill on tmpfs
# naturally. The previous symlink to /storage/.cache/rfkill conflicted with
# systemd's StateDirectory= mechanism (ELOOP).
d    /var/lib/systemd/rfkill 0755 root root - -
