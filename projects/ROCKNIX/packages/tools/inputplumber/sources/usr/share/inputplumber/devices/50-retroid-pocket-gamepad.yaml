# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# Schema version number
version: 1

# The type of configuration schema
kind: CompositeDevice

# Name of the composite device mapping
name: Retroid Pocket Gamepad

# No model matching — applies to any device with the Retroid gamepad hardware.
# The retroid-pocket-gamepad serial driver uses vendor 0x2020.
matches: []

# Only allow a single source device per composite device of this type.
single_source: false

# One or more source devices to combine into a single virtual device.
source_devices:
  - group: gamepad
    evdev:
      vendor_id: "2020"
      product_id: "3001"
      handler: event*
    capability_map_id: retroid_pocket_gamepad

# Optional configuration for the composite device
options:
  auto_manage: true

# The target input device(s) to emulate by default
target_devices:
  - xbox-series
  - mouse
  - keyboard
